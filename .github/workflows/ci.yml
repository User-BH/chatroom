name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.5 / ${{ matrix.mysql }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mysql: ['mysql:8.4', 'mysql:9.7']
    env:
      MYSQL_IMAGE: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start PHP-FPM, Nginx and MySQL
        run: docker compose up -d --build --wait

      - name: Build test image
        run: docker compose --profile test build tests

      - name: Lint PHP
        run: docker compose run --rm tests sh -c "find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null"

      - name: End-to-end tests
        run: docker compose run --rm tests

      - name: Nginx and PHP-FPM tests
        run: docker compose run --rm tests php tests/webserver.php

      - name: Upgrade from the first released schema
        run: |
          root='mysql -uroot -plocal-root-password'
          git show 5060d1d:database.sql | tr -d '\r' | sed 's/chatroom_secure/chatroom_upgrade/g' | docker compose exec -T db $root
          migrate() {
            docker compose run --rm -e CHATROOM_DB_HOST=db -e CHATROOM_DB_NAME=chatroom_upgrade -e CHATROOM_DB_USER=root \
              -e CHATROOM_DB_PASS=local-root-password -e CHATROOM_ERROR_LOG_FILE=/tmp/migrate.log tests php scripts/migrate.php
          }
          migrate
          migrate | grep -q 'Nothing to migrate'
          test "$(docker compose exec -T db $root -N chatroom_upgrade -e 'SELECT COUNT(*) FROM admins')" = "0"
          docker compose exec -T db $root chatroom_upgrade -e 'SELECT session_version FROM users LIMIT 1'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=100 nginx fpm db

  package:
    name: Build release package
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          mkdir dist
          git archive --format=tar.gz --prefix="chatroom-$version/" -o "dist/chatroom-$version.tar.gz" HEAD
          (cd dist && sha256sum "chatroom-$version.tar.gz" > "chatroom-$version.tar.gz.sha256")
          tar -tzf "dist/chatroom-$version.tar.gz" | grep -q 'assets/fonts/Vazirmatn-Regular.woff2'
          if tar -tzf "dist/chatroom-$version.tar.gz" | grep -qE '/tests/|/docker/|/\.github/|docker-compose'; then
            echo 'Package contains files that must not ship' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: chatroom-release
          path: dist/*

      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
